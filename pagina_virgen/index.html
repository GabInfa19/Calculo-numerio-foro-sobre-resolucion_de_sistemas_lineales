<title>Virgen entre nubes</title>
<style>
/* Concepto: una capilla de cielo. La imagen estática va en una ventana arqueada dorada al centro;
   alrededor, un cielo vivo con nubes, rayos, rosas, pétalos y destellos, todo dentro de un marco dorado. */
:root {
  --ink: #1c2a3f;
  --sky: #9fbad6;
  --cream: #fff3d8;
  --gold: #d4a62a;
  --gold-hi: #f8e6a0;
  --gold-lo: #86631a;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--cream);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
}
.stage { position: relative; width: 100%; height: 100%; min-height: 320px; overflow: hidden; background: var(--sky); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#bg { z-index: 0; }
#fg { z-index: 2; pointer-events: none; }

/* ventana arqueada */
.altar {
  position: absolute; z-index: 1; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  height: 88%;
  aspect-ratio: 9 / 16;
  max-width: 78%;
  margin: 0;
  padding: clamp(6px, 0.9vh, 11px);
  box-sizing: border-box;
  border-radius: 999px 999px 14px 14px;
  background: linear-gradient(135deg, var(--gold-hi), var(--gold) 28%, var(--gold-lo) 52%, var(--gold-hi) 74%, var(--gold));
  box-shadow: 0 0 70px 14px rgba(255, 222, 140, .55), 0 24px 60px rgba(30, 30, 50, .4);
}
.altar::before {
  content: ""; position: absolute; inset: clamp(3px, .45vh, 6px);
  border-radius: inherit; border: 1.5px solid rgba(255, 246, 205, .85); pointer-events: none; z-index: 2;
}
.altar img {
  display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%;
  border-radius: 999px 999px 6px 6px;
  border: 3px solid #fff0b8; box-sizing: border-box;
}
.finial {
  position: absolute; left: 50%; top: 0; width: clamp(22px, 3.4vh, 38px); aspect-ratio: 1;
  transform: translate(-50%, -62%); z-index: 3; color: var(--gold-hi);
  filter: drop-shadow(0 0 8px rgba(255, 220, 120, .9));
}

/* marco de página */
.page-frame { position: absolute; z-index: 3; inset: clamp(6px, 1.4vh, 16px); pointer-events: none;
  border: 4px solid transparent;
  border-image: linear-gradient(135deg, var(--gold-hi), var(--gold) 30%, var(--gold-lo) 55%, var(--gold-hi) 80%, var(--gold)) 1;
  box-shadow: inset 0 0 40px rgba(255, 230, 150, .35);
}
.page-frame::before { content: ""; position: absolute; inset: clamp(5px, 1vh, 11px);
  border: 1.5px solid rgba(248, 230, 160, .85); }
.corner { position: absolute; width: clamp(48px, 9vh, 100px); aspect-ratio: 1; color: var(--gold-hi);
  filter: drop-shadow(0 0 6px rgba(120, 80, 10, .5)); }
.corner.tl { left: -4px; top: -4px; }
.corner.tr { right: -4px; top: -4px; transform: scaleX(-1); }
.corner.bl { left: -4px; bottom: -4px; transform: scaleY(-1); }
.corner.br { right: -4px; bottom: -4px; transform: scale(-1, -1); }

.fs {
  position: absolute; z-index: 4; right: clamp(22px, 3.2vh, 40px); bottom: clamp(22px, 3.2vh, 40px);
  width: 40px; height: 40px; border-radius: 50%; padding: 0; cursor: pointer;
  background: rgba(40, 32, 12, .45); color: var(--gold-hi);
  border: 1.5px solid var(--gold); display: grid; place-items: center;
}
.fs:hover { background: rgba(40, 32, 12, .7); }
.fs:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.fs[hidden] { display: none !important; }

@media (max-width: 700px) {
  .altar { max-width: 86%; height: 82%; }
}
</style>

    var g = x.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#2c6638'); g.addColorStop(1, '#78ad4c');
    x.fillStyle = g; x.beginPath(); x.moveTo(4, h / 2);
    x.quadraticCurveTo(w * .45, -h * .15, w - 4, h / 2); x.quadraticCurveTo(w * .45, h * 1.15, 4, h / 2); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 2; x.beginPath(); x.moveTo(8, h / 2); x.lineTo(w - 14, h / 2); x.stroke();
    return cv;
  }
  function makePetal(c) {
    var cv = mk(48, 64), x = cv.getContext('2d');
    var g = x.createRadialGradient(24, 26, 4, 24, 32, 34); g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
    x.fillStyle = g; x.beginPath(); x.moveTo(24, 2); x.bezierCurveTo(52, 16, 46, 56, 24, 62); x.bezierCurveTo(2, 56, -4, 16, 24, 2); x.fill();
    return cv;
  }
  function makeStar() {
    var s = 96, cv = mk(s, s), x = cv.getContext('2d'); x.translate(s / 2, s / 2);
    var g = x.createRadialGradient(0, 0, 0, 0, 0, s * .24); g.addColorStop(0, 'rgba(255,248,215,1)'); g.addColorStop(1, 'rgba(255,225,140,0)');
    x.fillStyle = g; x.beginPath(); x.arc(0, 0, s * .24, 0, TAU); x.fill();
    var r = s * .46; x.fillStyle = 'rgba(255,247,214,.95)'; x.beginPath(); x.moveTo(0, -r);
    x.quadraticCurveTo(0, 0, r, 0); x.quadraticCurveTo(0, 0, 0, r); x.quadraticCurveTo(0, 0, -r, 0); x.quadraticCurveTo(0, 0, 0, -r); x.fill();
    return cv;
  }
  function makeCloud() {
    var w = 640, h = 280, cv = mk(w, h), x = cv.getContext('2d');
    for (var i = 0; i < 28; i++) {
      var u = R(), px = w * (.12 + .76 * u), hump = Math.sin(u * Math.PI);
      var py = h * (.67 - .42 * hump * R()), r = h * (.16 + .22 * hump * (.5 + .5 * R()));
      var g = x.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, 'rgba(255,252,244,.95)'); g.addColorStop(.6, 'rgba(255,244,224,.7)'); g.addColorStop(1, 'rgba(255,238,210,0)');
      x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
    }
    x.globalCompositeOperation = 'source-atop';
    var sh = x.createLinearGradient(0, h * .3, 0, h * .85); sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(205,170,140,.38)');
    x.fillStyle = sh; x.fillRect(0, 0, w, h);
    return cv;
  }

  var roses = [
    makeRose('#ffa062', '#d9501f', 'rgba(110,30,10,1)'),   /* naranja */
    makeRose('#ffe27e', '#e0a21c', 'rgba(120,70,0,1)'),    /* amarilla */
    makeRose('#ee5844', '#a8182a', 'rgba(70,5,15,1)'),     /* roja */
    makeRose('#ffc9a0', '#e5804c', 'rgba(110,40,15,1)'),   /* durazno */
    makeRose('#ff9a94', '#c9404a', 'rgba(90,15,25,1)')     /* coral */
  ];
  var leaf = makeLeaf(), star = makeStar();
  var clouds = [makeCloud(), makeCloud(), makeCloud(), makeCloud()];
  var petals = [makePetal(['#ffe1d8', '#f0a79a']), makePetal(['#ffd9b8', '#eb9a62']), makePetal(['#fff0c8', '#f2c25a'])];

  /* ---------- escena (posiciones relativas, se escalan al dibujar) ---------- */
  var flowers = [];
  function addRose(xf, yf, sz) {
    var leaves = [], n = 2 + (R() * 2 | 0);
    for (var i = 0; i < n; i++) leaves.push({ a: rand(0, TAU), len: rand(.9, 1.5) });
    flowers.push({ s: roses[R() * roses.length | 0], x: xf, y: yf, sz: sz, rot: rand(0, TAU), ph: rand(0, TAU), leaves: leaves });
  }
  [-1, 1].forEach(function (side) {
    for (var i = 0; i < 17; i++) {
      var tt = i / 16, yf = 1.0 - tt * 0.86 + rand(-.04, .04);
      var edge = 0.02 + 0.115 * Math.pow(1 - tt, 1.4) + rand(0, .06);
      addRose(side < 0 ? edge : 1 - edge, yf, 0.15 - 0.075 * tt + rand(-.02, .02));
    }
  });
  for (var b = 0; b < 11; b++) addRose(0.16 + b * 0.068 + rand(-.02, .02), 1.03 + rand(-.015, .02), rand(.09, .13));
  flowers.sort(function (p, q) { return p.sz - q.sz; });
  flowers.forEach(function (f, i) { if (i % 3 === 0) f.front = true; });

  var layers = [
    { n: 6, y0: .06, y1: .32, w0: .20, w1: .32, a: .62, v: 5 },
    { n: 6, y0: .36, y1: .66, w0: .22, w1: .34, a: .85, v: 9 },
    { n: 7, y0: .74, y1: .96, w0: .30, w1: .46, a: .96, v: 15 }
  ].map(function (L) {
    var arr = []; for (var i = 0; i < L.n; i++) arr.push({ c: clouds[R() * clouds.length | 0], x: R(), y: rand(L.y0, L.y1), w: rand(L.w0, L.w1), flip: R() < .5 });
    return { a: L.a, v: L.v, items: arr };
  });

  var sparks = []; for (var i = 0; i < 90; i++) sparks.push({ x: R(), y: R(), v: rand(8, 26), s: rand(.012, .034), ph: rand(0, TAU), f: rand(1.4, 3.2) });
  var drops = []; for (var j = 0; j < 46; j++) drops.push({ x: R(), y: R(), v: rand(22, 52), s: rand(.016, .034), ph: rand(0, TAU), sp: rand(.6, 1.5), p: petals[R() * 3 | 0], rs: rand(.6, 1.8) });

  /* ---------- lienzos ---------- */
  var stage = document.getElementById('stage');
  var bg = document.getElementById('bg'), fg = document.getElementById('fg');
  var bx = bg.getContext('2d'), fx = fg.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = stage.clientWidth; H = stage.clientHeight;
    [bg, fg].forEach(function (c) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); });
    bx.setTransform(dpr, 0, 0, dpr, 0, 0); fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawBg(t) {
    var g = bx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#86a9cf'); g.addColorStop(.42, '#c6d7e6'); g.addColorStop(.74, '#f1dfc0'); g.addColorStop(1, '#f3c88a');
    bx.globalCompositeOperation = 'source-over'; bx.fillStyle = g; bx.fillRect(0, 0, W, H);
    var cx = W / 2, cy = H * .25, big = Math.max(W, H) * 1.3;
    var gl = bx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W * .5, H * .7));
    gl.addColorStop(0, 'rgba(255,240,190,.9)'); gl.addColorStop(.45, 'rgba(255,228,160,.32)'); gl.addColorStop(1, 'rgba(255,228,160,0)');
    bx.fillStyle = gl; bx.fillRect(0, 0, W, H);
    /* rayos */
    bx.globalCompositeOperation = 'screen';
    var rg = bx.createRadialGradient(cx, cy, 0, cx, cy, big);
    rg.addColorStop(0, 'rgba(255,238,175,.55)'); rg.addColorStop(1, 'rgba(255,238,175,0)');
    bx.fillStyle = rg;
    var nR = 26;
    for (var i = 0; i < nR; i++) {
      var a = i * TAU / nR + t * 0.018, wdt = (0.045 + 0.03 * Math.sin(i * 2.3)) * (0.8 + 0.2 * Math.sin(t * .6 + i));
      bx.globalAlpha = .45 + .45 * Math.sin(t * .45 + i * 1.7) * Math.sin(t * .45 + i * 1.7);
      bx.beginPath(); bx.moveTo(cx, cy);
      bx.lineTo(cx + Math.cos(a - wdt) * big, cy + Math.sin(a - wdt) * big);
      bx.lineTo(cx + Math.cos(a + wdt) * big, cy + Math.sin(a + wdt) * big);
      bx.closePath(); bx.fill();
    }
    bx.globalAlpha = 1; bx.globalCompositeOperation = 'source-over';
    /* nubes */
    var k = W / 1920;
    layers.forEach(function (L) {
      bx.globalAlpha = L.a;
      L.items.forEach(function (c) {
        var cw = W * c.w, ch = cw * 280 / 640, span = W + cw;
        var px = ((c.x * span + t * L.v * Math.max(k, .5)) % span) - cw;
        var py = H * c.y - ch / 2;
        if (c.flip) { bx.save(); bx.translate(px + cw, py); bx.scale(-1, 1); bx.drawImage(c.c, 0, 0, cw, ch); bx.restore(); }
        else bx.drawImage(c.c, px, py, cw, ch);
      });
    });
    bx.globalAlpha = 1;
  }

  function drawRoseEl(f, t, pass) {
    var size = Math.min(H * f.sz, W * f.sz * 1.15), px = f.x * W, py = f.y * H;
    var sway = Math.sin(t * .8 + f.ph), rot = f.rot + sway * .05, dy = Math.sin(t * .9 + f.ph) * H * .004;
    fx.save(); fx.translate(px, py + dy);
    if (pass === 0) {
      f.leaves.forEach(function (l) {
        fx.save(); fx.rotate(l.a + sway * .06); var len = size * l.len;
        fx.drawImage(leaf, size * .12, -len * .21, len, len * .43); fx.restore();
      });
    } else {
      fx.rotate(rot); fx.shadowColor = 'rgba(70,20,10,.4)'; fx.shadowBlur = size * .12; fx.shadowOffsetY = size * .04;
      fx.drawImage(f.s, -size / 2, -size / 2, size, size);
    }
    fx.restore();
  }

  var hole = null;
  function inHole(x, y) { return hole && x > hole.x - 10 && x < hole.x + hole.width + 10 && y > hole.y - 10 && y < hole.y + hole.height + 10; }
  function drawFg(t) {
    fx.clearRect(0, 0, W, H);
    flowers.forEach(function (f) { if (!f.front) drawRoseEl(f, t, 0); });
    flowers.forEach(function (f) { if (!f.front) drawRoseEl(f, t, 1); });
    flowers.forEach(function (f) { if (f.front) drawRoseEl(f, t, 0); });
    flowers.forEach(function (f) { if (f.front) drawRoseEl(f, t, 1); });
    /* pétalos */
    drops.forEach(function (d) {
      var y = ((d.y * H + t * d.v * (H / 1080)) % (H + 60)) - 30;
      var x = d.x * W + Math.sin(t * d.sp + d.ph) * W * .02;
      if (inHole(x, y)) return;
      var sz = H * d.s;
      fx.save(); fx.translate(x, y); fx.rotate(t * d.rs + d.ph); fx.scale(Math.cos(t * d.sp * 1.7 + d.ph) * .5 + .6, 1);
      fx.globalAlpha = .88; fx.drawImage(d.p, -sz * .35, -sz * .5, sz * .7, sz); fx.restore();
    });
    /* destellos */
    fx.globalCompositeOperation = 'lighter';
    sparks.forEach(function (s) {
      var y = ((s.y * H - t * s.v * (H / 1080)) % H + H) % H, x = s.x * W + Math.sin(t * .6 + s.ph) * W * .006;
      if (inHole(x, y)) return;
      var a = .5 + .5 * Math.sin(t * s.f + s.ph), sz = H * s.s * (.6 + .6 * a);
      fx.globalAlpha = .25 + .75 * a; fx.drawImage(star, x - sz / 2, y - sz / 2, sz, sz);
    });
    fx.globalAlpha = 1; fx.globalCompositeOperation = 'source-over';
  }

  var altar = document.querySelector('.altar');
  function glow(t) {
    var p = .5 + .5 * Math.sin(t * 1.1);
    altar.style.boxShadow = '0 0 ' + (60 + 30 * p) + 'px ' + (10 + 8 * p) + 'px rgba(255,222,140,' + (.45 + .2 * p) + '), 0 24px 60px rgba(30,30,50,.4)';
  }
  var capture = /[?&]capture/.test(location.search);
  if (capture) { document.querySelector('.altar img').src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGNg+M8AAAICAQB7CYF4AAAAAElFTkSuQmCC';  hole = document.querySelector('.altar img').getBoundingClientRect(); }
  window.__renderAt = function (t) { drawBg(t); drawFg(t); glow(t); };
  var reduce = capture || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var t0 = performance.now();
  function frame(now) { var t = (now - t0) / 1000; drawBg(t); drawFg(t); glow(t); if (!reduce) requestAnimationFrame(frame); }
  function start() { resize(); if (reduce) { drawBg(2); drawFg(2); } else requestAnimationFrame(frame); }
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { resize(); if (reduce) { drawBg(2); drawFg(2); } }, 80); });
  start();

  /* pantalla completa */
  var btn = document.getElementById('fs');
  if (!stage.requestFullscreen || capture) btn.hidden = true;
  btn.addEventListener('click', function () {
    try {
      if (document.fullscreenElement) { var p = document.exitFullscreen(); if (p && p.catch) p.catch(function () {}); }
      else { var q = stage.requestFullscreen(); if (q && q.catch) q.catch(function () { btn.hidden = true; }); }
    } catch (e) { btn.hidden = true; }
  });
})();
</script>
